# Secrets are set separately (see README.md).
name = "sweepwell-licence"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[vars]
PRODUCT_ID = "<stripe product id, prod_...>"   # test-mode id first; the live id when going live
APP_NAME = "Sweepwell"
PRO_NAME = "Sweepwell Pro"
URL_SCHEME = "sweepwell"                          # the app registers <slug>://activate?key=...
LICENCE_PRODUCT = "sweepwell-pro"                 # must equal LicenceKey.product in the app
PLATFORM_NOUN = "Mac"                          # Mac, PC, computer, phone...

# npx wrangler kv namespace create REVOKED  → paste the id it prints
[[kv_namespaces]]
binding = "REVOKED"
id = "<kv namespace id>"

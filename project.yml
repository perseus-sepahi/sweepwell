name: Sweepwell
options:
  bundleIdPrefix: com.perseussepahi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  SweepwellKit:
    path: SweepwellKit
settings:
  base:
    # Apple silicon only, by design.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sweepwell:
    type: application
    platform: macOS
    sources:
      - Sweepwell
    dependencies:
      - package: SweepwellKit
    info:
      path: Sweepwell/Info.plist
      properties:
        CFBundleDisplayName: Sweepwell
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 Perseus Sepahi"
        NSAppleEventsUsageDescription: "Sweepwell asks Finder to move apps that need an administrator password to the Trash."
    entitlements:
      path: Sweepwell/Sweepwell.entitlements
      properties:
        # A disk cleaner has to reach other apps' folders, which the App Sandbox forbids.
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perseussepahi.sweepwell
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
